<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 3D stress ball that wears your face. Squish, pinch, pick it up and drop it.">
<title>Squish Face</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: the ball owns the whole screen. Title top-left, two round tools top-right,
   one floating dock at the bottom whose tabs open a small card of choices. */
:root{
  --bg:#F3F0EB; --fg:#1E1B18; --muted:#7A726B; --card:#FFFFFF; --line:rgba(30,27,24,.09);
  --accent:#FF6326; --accent-fg:#FFFFFF; --accent-soft:#FDE7DC; --shadow:0 12px 32px -14px rgba(60,40,25,.28);
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1917; --fg:#F2EDE7; --muted:#A39A91; --card:#282420; --line:rgba(255,255,255,.08);
  --accent:#FF7E45; --accent-fg:#1B0D05; --accent-soft:#3D2A20; --shadow:0 12px 32px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1917; --fg:#F2EDE7; --muted:#A39A91; --card:#282420; --line:rgba(255,255,255,.08);
  --accent:#FF7E45; --accent-fg:#1B0D05; --accent-soft:#3D2A20; --shadow:0 12px 32px -14px rgba(0,0,0,.6); color-scheme:dark}

[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
.app{position:relative;height:100%;overflow:hidden}
.stage{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.grabbing{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}

header{position:absolute;top:24px;left:max(24px,env(safe-area-inset-left,0px));pointer-events:none;z-index:2}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.4vw,44px);line-height:1;margin:0}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:16px;line-height:1.45;margin:14px 0 0;max-width:15em}

.tools{position:absolute;top:24px;right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:10px;z-index:3}
.icon-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--card);color:var(--fg);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn:hover{color:var(--accent)}
#sound[aria-pressed="true"]{color:var(--muted)}
#squeeze{touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .12s,background .12s}
#squeeze.on{transform:scale(.88,.8);background:var(--accent);color:var(--accent-fg)}

.note{position:absolute;left:calc(50% - min(34vw,330px));top:30%;z-index:1;pointer-events:none;color:var(--fg);
  font:600 34px/1 var(--hand);transform:rotate(-12deg);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.9}
.note svg{margin-left:50px}
.status{position:absolute;top:24px;left:50%;transform:translateX(-50%);z-index:3;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* dock + card */
.dock{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;
  display:flex;gap:4px;padding:8px;background:var(--card);border-radius:30px;box-shadow:var(--shadow)}
.tab{width:112px;border:0;background:none;color:var(--muted);border-radius:22px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 15px/1 var(--body);cursor:pointer}
.tab svg{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.pop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px) + 96px);z-index:4;
  width:max-content;max-width:calc(100% - 32px);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px}
.pop::after{content:"";position:absolute;bottom:-7px;left:var(--caret,50%);width:14px;height:14px;background:var(--card);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.panel{display:flex;flex-direction:column;gap:14px;align-items:center}
.panel[data-panel="face"]{max-height:calc(100dvh - 180px);overflow-y:auto;padding:3px;overscroll-behavior:contain}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.hint-text{font-size:13px;color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:8px;align-items:center}

.btn{font:600 14px/1 var(--body);color:var(--fg);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px}
.seg button{font:600 14px/1 var(--body);color:var(--muted);background:none;border:1.5px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

.mats{display:flex;gap:6px}
.mat{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font:500 14px/1 var(--body);color:var(--fg);padding:6px 8px;border-radius:16px}
.mat .sphere{width:52px;height:52px;border-radius:50%;display:block;outline:2px solid transparent;outline-offset:3px}
.mat[aria-pressed="true"] .sphere{outline-color:var(--accent)}
.sphere.squishy{background:radial-gradient(circle at 34% 28%,#fff 0 7%,#FFC2A6 20%,#F08A62 62%,#C9603D 100%)}
.sphere.foam{background:radial-gradient(circle at 38% 32%,#9CC3EE 0,#6D9FDB 45%,#4776B5 100%)}
.sphere.plastic{background:radial-gradient(circle at 33% 27%,#fff 0 9%,#FFE07A 16%,#F2B825 58%,#BE860A 100%)}
.sphere.clay{background:radial-gradient(circle at 40% 34%,#B9C9A6 0,#93A882 50%,#6E8160 100%)}

.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.small{width:24px;height:24px}
.sw[aria-checked="true"]{box-shadow:0 0 0 2.5px var(--fg)}
.sw.skin{position:relative}
.sw.skin::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px dashed var(--muted);pointer-events:none}
.thumbs{display:grid;grid-template-columns:repeat(9,52px);gap:8px;justify-content:center}
.thumb{width:52px;height:52px;border-radius:50%;padding:0;border:0;background:none;cursor:pointer;outline:2px solid transparent;outline-offset:2px}
.thumb canvas{width:100%;height:100%;display:block;border-radius:50%}
.thumb[aria-checked="true"]{outline-color:var(--accent)}
.thumbs.expr{grid-template-columns:repeat(7,52px)}
.btn:focus-visible,.sw:focus-visible,.seg button:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.mat:focus-visible,.thumb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  header{top:20px;left:max(20px,env(safe-area-inset-left,0px))}
  .sub{font-size:13px;margin-top:10px;max-width:13em}
  .tools{top:20px;right:max(20px,env(safe-area-inset-right,0px));gap:8px}
  .icon-btn{width:42px;height:42px}
  .note{left:auto;right:28px;top:27%;font-size:26px}
  .note svg{margin-left:0;transform:scaleX(-1) rotate(30deg)}
  .dock{bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:6px;width:calc(100% - 32px);justify-content:space-between}
  .tab{width:auto;flex:1;font-size:12px}
  .pop{bottom:calc(14px + env(safe-area-inset-bottom,0px) + 82px);padding:14px 12px}
  .thumbs{grid-template-columns:repeat(5,48px)} .thumbs.expr{grid-template-columns:repeat(4,48px)}
  .thumb{width:48px;height:48px}
  .mat .sphere{width:44px;height:44px}
  .status{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px) + 86px)}
}

/* crop sheet */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,14,10,.5);padding:16px}
.card{background:var(--card);color:var(--fg);border-radius:24px;padding:20px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
#crop{width:100%;max-width:324px;aspect-ratio:300/340;align-self:center;border-radius:16px;touch-action:none;cursor:move;background:#222}
.zrow{display:flex;gap:10px;align-items:center}
.zrow input[type=range]{flex:1;accent-color:var(--accent)}
.actions{display:flex;gap:10px}
.actions .btn{flex:1;justify-content:center}
@media (prefers-reduced-motion:reduce){#squeeze{transition:none}}
</style>

</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="3D squishy stress ball. Press or drag it to squish, pinch it, hold then lift to pick it up; drag the background to turn it."></canvas>
  </div>

  <header>
    <h1>Squish <span>Face</span></h1>
    <p class="sub">A 3D stress ball that wears your face. Go on, squeeze it.</p>
  </header>

  <div class="tools">
    <button class="icon-btn" id="squeeze" aria-label="Hold to squeeze" title="Hold to squeeze">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5V4a1.5 1.5 0 0 1 3 0v8"/><path d="M14 11.5V6a1.5 1.5 0 0 1 3 0v7.5"/><path d="M17 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L4.6 15.6a1.5 1.5 0 0 1 2.3-1.9L8 15"/></svg>
    </button>
    <button class="icon-btn" id="sound" aria-pressed="false"></button>
    <button class="icon-btn" id="reset" aria-label="Reset the ball" title="Reset">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>

  <div class="note" id="hint" aria-hidden="true">
    <span>Squeeze it.</span>
    <svg width="64" height="42" viewBox="0 0 64 42" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4c2 16 14 28 46 30"/><path d="M42 26l9 8-10 6"/></svg>
  </div>
  <div class="status" id="status" role="status" hidden></div>

  <div class="pop" id="pop" hidden>
    <div class="panel" data-panel="photo" hidden>
      <div class="sect" id="photoEmpty">
        <label class="btn primary" for="photo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>Upload a photo</label>
        <span class="hint-text">Then frame it and choose how it goes on the ball.</span>
      </div>
      <div class="sect" id="styleGroup" hidden>
        <span class="label">On the ball</span>
        <div class="seg" id="styleSeg">
          <button aria-pressed="true" data-style="features">Eyes &amp; mouth</button>
          <button aria-pressed="false" data-style="photo">Whole photo</button>
          <button aria-pressed="false" data-style="ink">Ink print</button>
          <button aria-pressed="false" data-style="sculpt">Sculpted</button>
        </div>
        <div class="row">
          <label class="btn" for="photo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>New photo</label>
          <button class="btn" id="adjust" hidden>Adjust framing</button>
        </div>
      </div>
    </div>
    <div class="panel" data-panel="material" hidden>
      <div class="mats" id="matSeg">
        <button class="mat" aria-pressed="true" data-mat="squishy"><span class="sphere squishy"></span>Squishy</button>
        <button class="mat" aria-pressed="false" data-mat="foam"><span class="sphere foam"></span>Foam</button>
        <button class="mat" aria-pressed="false" data-mat="plastic"><span class="sphere plastic"></span>Bouncy</button>
        <button class="mat" aria-pressed="false" data-mat="clay"><span class="sphere clay"></span>Clay</button>
      </div>
      <div class="row" role="radiogroup" aria-label="Ball color" id="swatches"></div>
    </div>
    <div class="panel" data-panel="face" hidden>
      <div class="thumbs" id="presetRow" role="radiogroup" aria-label="Face"></div>
      <input class="vh" type="file" id="photo" accept="image/*">
    </div>
    <div class="panel" data-panel="hair" hidden>
      <div class="seg" id="hairSeg">
        <button aria-pressed="false" data-hair="none">None</button>
        <button aria-pressed="true" data-hair="tuft">Tuft</button>
        <button aria-pressed="false" data-hair="mohawk">Mohawk</button>
        <button aria-pressed="false" data-hair="curls">Curls</button>
        <button aria-pressed="false" data-hair="shaggy">Shaggy</button>
      </div>
      <div class="row" role="radiogroup" aria-label="Hair color" id="hairSwatches"></div>
    </div>
  </div>

  <nav class="dock" aria-label="Customize">
    <button class="tab" data-tab="photo" aria-selected="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo</button>
    <button class="tab" data-tab="material" aria-selected="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/><circle cx="12" cy="12" r="10.2" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".35"/></svg>Material</button>
    <button class="tab" data-tab="face" aria-selected="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.6"/></svg>Face</button>
    <button class="tab" data-tab="hair" aria-selected="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c0-6 1-11 6-15"/><path d="M12 21c0-5-2-9-7-12"/><path d="M12 21V8"/><path d="M17 3l1 2.5L20.5 6 18 7l-1 2.5L16 7l-2.5-1L16 5z"/></svg>Hair</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cropTitle">
    <h2 id="cropTitle">Frame your face</h2>
    <p>Drag to move, zoom to fit. Put your eyes on the dotted line.</p>
    <canvas id="crop"></canvas>
    <div class="zrow"><span class="label">Zoom</span><input type="range" id="zoom" min="0.3" max="4" step="0.01" value="1"></div>
    <div class="actions">
      <button class="btn" id="cancelCrop">Cancel</button>
      <button class="btn accent" id="applyCrop">Put it on the ball</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('gl');
if (!window.THREE) { stage.insertAdjacentHTML('beforeend','<div class="err">The 3D engine didn’t load. Check your connection and reload.</div>'); return; }

/* ---------------- settings ---------------- */
/* Materials: look + how the rubber moves.
   k/damp = spring back speed, pull = how far it stretches, press = dent depth,
   bounce = restitution on landing, impact = squash on landing, jig = wobble when moved */
const MATS = {
  squishy:{ palette:[{name:'Sky',base:'#45AEF2'},{name:'Bubblegum',base:'#FF7FB0'},{name:'Lime',base:'#8DD45E'},{name:'Tangerine',base:'#FF9A3D'},{name:'Lilac',base:'#A98CF6'},{name:'Cream',base:'#F1E9DA'}],
    rough:.53, coat:.18, coatR:.38, env:.85, bump:.003, wr:.024, wrBase:.025, k:.075, damp:.81, pull:.85, press:.24, bounce:.28, impact:1.15, jig:.8, reb:.93, follow:.25, volume:1, friction:.18, settle:.035, hair:'tuft', face:'features' },
  foam:{ palette:[{name:'Charcoal',base:'#47474A'},{name:'Stone',base:'#9C9A94'},{name:'Sand',base:'#C9B38F'},{name:'Porcelain',base:'#ECE8E1'}],
    rough:.96, coat:0, coatR:0, env:.38, bump:.018, wr:.025, wrBase:.08, k:.018, damp:.72, pull:.75, press:.34, bounce:.045, impact:1.3, jig:.23, reb:.978, follow:.17, volume:.25, friction:.3, settle:.07, hair:'none', face:'sculpt' },
  plastic:{ palette:[{name:'Cherry',base:'#E3312C'},{name:'Lemon',base:'#FFC814'},{name:'Cobalt',base:'#1F6FE5'},{name:'Tangerine',base:'#FF7A1A'},{name:'Snow',base:'#F2F2EF'},{name:'Jet',base:'#1C1C20'}],
    rough:.2, coat:.65, coatR:.12, env:1.1, bump:0, k:.3, damp:.82, pull:.16, press:.06, bounce:.82, impact:.5, jig:.16, reb:.72, follow:.5, volume:1, friction:.055, settle:.008, hair:'none', face:'features', bouncy:true },
  clay:{ palette:[{name:'Terracotta',base:'#C2694A'},{name:'Ochre',base:'#D6A243'},{name:'Sage',base:'#8FA382'},{name:'Plum',base:'#7D4C6C'},{name:'Grey clay',base:'#A9A49A'}],
    rough:.98, coat:0, coatR:0, env:.3, bump:.016, k:.28, damp:.62, pull:.55, press:.14, bounce:0, impact:0, jig:.04, reb:.8, follow:.2, volume:1, friction:.48, settle:0, hair:'none', face:'sculpt', clay:true }
};
const HAIR_COLORS=[{name:'Sunshine',base:'#D49B00'},{name:'Ink',base:'#1E1D22'},{name:'Cocoa',base:'#6B4226'},{name:'Ginger',base:'#D9622B'},{name:'Bubblegum',base:'#FF6FA8'},{name:'Mint',base:'#5FD3A6'}];
const state = { mat:'squishy', color:0, style:'features', img:null, crop:null, marks:null, squishes:0, sound:true,
  hair:'tuft', hairColor:0, hairTouched:false, preset:'me', expr:'none', src:null, srcMarks:null };
const M = () => MATS[state.mat];
// with a photo on, the palette starts with a colour sampled from your skin
const palette = () => state.skin ? [{name:'Your skin tone', base:state.skin, skin:true}, ...M().palette] : M().palette;
const COLOR = () => palette()[state.color] || M().palette[0];

// Face oval, in face-texture coordinates (0..1, y down). The texture is projected from the front.
const FACE = { cx:.5, cy:.55, rx:.26, ry:.30 };
const EYE_LINE = .465;
const PW = 2.4;               // projection width: u = .5 + x/PW, v = .5 + y/PW

/* ---------------- renderer + scene ---------------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true}); }
catch(e){ stage.insertAdjacentHTML('beforeend','<div class="err">This browser can’t draw 3D (WebGL is off). Try a recent Chrome, Safari or Firefox.</div>'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, .1, 100);

// soft studio environment for reflections
(() => {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16), new THREE.MeshBasicMaterial({color:0x58625d, side:THREE.BackSide})));
  const panel = (w,h,x,y,z,k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:new THREE.Color(1,1,1).multiplyScalar(k), side:THREE.DoubleSide}));
    m.position.set(x,y,z); m.lookAt(0,0,0); env.add(m);
  };

const FIXED_MS=1000/60;
let lastFrame=null, accumulator=0;
function frame(now=performance.now()){
  if(lastFrame===null) lastFrame=now-FIXED_MS;
  accumulator+=Math.min(100,Math.max(0,now-lastFrame)); lastFrame=now;
  while(accumulator>=FIXED_MS){
    if(!spin){ rotY+=rotV; rotV*=.93; }
    group.rotation.y=rotY;
    const acc=stepBody();
    group.position.set(body.x,body.y,0);
    group.updateMatrixWorld(true);
    step(acc); updateHair(acc); updateAnimalDetails();
    accumulator-=FIXED_MS;
  }
  key.position.set(body.x-2.6,body.y+5,3.6); key.target.position.set(body.x,body.y,0);
  renderContactShadow();
  renderer.render(scene,camera);

function addAnimalPart(geometry,color,gloss=false){

      const j=i*3,d=(rest[j]-coords[v])**2+(rest[j+1]-coords[v+1])**2+(rest[j+2]-coords[v+2])**2;

}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>openTab(t.dataset.tab)));
stage.addEventListener('pointerdown',()=>{ if(!pop.hidden) closePop(); },true);
window.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!pop.hidden&&$('sheet').hidden) closePop(); });
window.addEventListener('resize',()=>{ if(!pop.hidden){ const n=pop.dataset.tab; pop.hidden=true; openTab(n); } });

/* ---------------- boot ---------------- */
setStyle(state.style); buildSwatches(); renderPresetRow(); applyMaterial(); buildFace(); setHair(state.hair); layout();
rotY=-.55; rotV=.03;    // turns to face you on arrival, so it reads as 3D
body.y=.9;              // and drops in
frame();
})();
</script>
